name: Nix Diff Check

on:
  pull_request:
    paths:
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  nix-diff:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run nix-diff
        uses: natsukium/nix-diff-action@4091452e4c7b3c7ea4ecbaec84be7f0066d810d7 # main
        with:
          skip-no-change: true
          # Note: darwinConfigurations cannot be built on Linux runners.
          # Only the aarch64-linux config is diffed here because this job runs
          # on an aarch64 runner: evaluating the x86_64-linux config triggers an
          # import-from-derivation (the agent-skills bundle) whose x86_64-linux
          # build cannot run on this ARM runner and, for this fork's skills, is
          # not available from the binary cache. The x86_64-linux configuration
          # is still built end-to-end by the build-ubuntu job.
          attributes: |
            - displayName: home-manager (aarch64-linux)
              attribute: homeConfigurations.asktt1770-aarch64.activationPackage
